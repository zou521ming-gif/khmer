<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>说高棉语</title>
<meta name="theme-color" content="#F4F6FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="说高棉语">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#F4F6FB; --surface:#fff; --surface2:#EDF1F8; --ink:#0F172A; --mute:#64748B; --line:#E3E8F2;
  --pri:#2F6BFF; --pri2:#6A5BFF; --priglow:rgba(47,107,255,.38); --acc:#FFA51F; --acc2:#FF7A3D; --accglow:rgba(255,140,40,.4);
  --ok:#16A34A; --okbg:#E3F6EA; --bad:#E5484D; --badbg:#FDE8E9; --badglow:rgba(229,72,77,.28); --warnbg:#FFF4D6; --km2:#2459E0;
  --sh:0 8px 24px rgba(15,23,42,.08); --sh2:0 2px 8px rgba(15,23,42,.06); --glass:rgba(244,246,251,.86);
  --blue:var(--km2); --tabh:62px;
  --zh:-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif;
  --kmf:"Khmer Sangam MN","Noto Sans Khmer","Khmer OS Battambang","Khmer MN","Leelawadee UI",sans-serif;
}
html[data-theme=dark]{
  --bg:#0B1020; --surface:#161D31; --surface2:#222B45; --ink:#EEF2FF; --mute:#93A0C2; --line:#2A3454;
  --pri:#5B8CFF; --pri2:#8B6CFF; --priglow:rgba(91,140,255,.45); --acc:#FFB547; --acc2:#FF8A3D; --accglow:rgba(255,160,60,.4);
  --ok:#34D399; --okbg:#123528; --bad:#FF6B70; --badbg:#3A1A22; --badglow:rgba(255,107,112,.3); --warnbg:#3A3016; --km2:#A9C1FF;
  --sh:0 10px 28px rgba(0,0,0,.45); --sh2:0 2px 10px rgba(0,0,0,.35); --glass:rgba(11,16,32,.86);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--zh);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1,h2,h3,p{margin:0}

#top{position:sticky;top:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top)}
#top .bar{display:flex;align-items:baseline;justify-content:space-between;max-width:560px;margin:0 auto;padding:12px 18px 10px}
#top h1{font-size:21px;font-weight:800;letter-spacing:.02em}
#top .km{font-family:var(--kmf);font-size:14px;color:var(--mute)}

#view{max-width:560px;margin:0 auto;padding:10px 16px calc(var(--tabh) + 34px + env(safe-area-inset-bottom))}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;max-width:186px;height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute)}
#tabs svg{width:24px;height:24px}
#tabs button[aria-current=true]{color:var(--pri)}

.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--sh);margin-bottom:18px}
.card.flat{box-shadow:var(--sh2)}
.h2{font-size:17px;font-weight:800;margin:24px 2px 10px}
.sub{color:var(--mute);font-size:14px}
.km{font-family:var(--kmf);line-height:1.9}
.ph .zh{font-size:15px;color:var(--mute)}
.ph .km{font-size:clamp(30px,9.5vw,46px);font-weight:600;margin:2px 0 0;word-break:keep-all}
.ph .km .w{border-radius:8px;padding:0 2px}
.ph .km .w.on{background:var(--warnbg)}
.ph .ro{font-size:16px;color:var(--km2);font-weight:600;margin-bottom:12px}
.gloss{min-height:26px;font-size:15px;margin-top:10px}
.gloss b{font-family:var(--kmf);font-size:19px;font-weight:600}
.tips{margin:12px 0 0;padding:12px 14px;background:var(--surface2);border-radius:14px;font-size:14px}
.tips p+p{margin-top:6px}

.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.b{border:0;background:var(--surface2);border-radius:14px;padding:10px 16px;font-weight:700;min-height:46px}
.b.pri,.b.blue{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px var(--priglow)}
.b.ghost{background:none;color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line)}
.b.ok{background:var(--ok);color:#fff}
.b.bad{background:var(--bad);color:#fff}
.b.wide{width:100%}
.b:disabled{opacity:.45}
.b.ok:disabled,.b.bad:disabled{opacity:1}
.b.rec{background:var(--bad);color:#fff;box-shadow:0 0 0 calc(4px + var(--lv,0)*14px) var(--badglow)}
.arming{opacity:.6;transform:scale(.96)}

.talk{text-align:center;padding:6px 0 4px}
.mic{width:124px;height:124px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:18px;font-weight:800;line-height:1.3;box-shadow:0 12px 28px var(--priglow);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .1s}
.mic.rec{background:var(--bad);transform:scale(1.08);box-shadow:0 0 0 calc(8px + var(--lv,0)*22px) var(--badglow)}
.st{min-height:24px;margin:10px 0;color:var(--mute);font-size:15px}
.typed{display:flex;gap:8px;margin:4px 0 12px}
.typed[hidden]{display:none}
.typed input{flex:1;min-width:0;border:0;border-radius:14px;padding:10px 14px;background:var(--surface2)}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh2)}
.list .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.list .main .km{display:block;font-size:19px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--ok);color:#fff;margin-left:6px;vertical-align:middle}
.x{border:0;background:none;color:var(--mute);font-size:14px;padding:8px}

.err{background:var(--badbg);border-radius:16px;padding:12px 14px;margin:12px 0}
.err b{display:block;color:var(--bad)}
.err small{display:block;color:var(--mute);word-break:break-all;margin-top:4px}
.warn{border-radius:16px;padding:12px 14px;margin-bottom:16px;background:var(--warnbg)}

.stat{display:flex;gap:12px;margin-bottom:16px}
.stat div{flex:1;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--sh2);color:var(--mute);font-size:13px}
.stat b{font-size:28px;display:block;line-height:1.2;color:var(--ink)}
.path{list-style:none;margin:0;padding:0}
.node{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh2);color:var(--ink)}
.node .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface2);color:var(--pri)}
.node.done .n{background:var(--ok);color:#fff}
.node.open{box-shadow:var(--sh),inset 0 0 0 2px var(--pri)}
.node.open .n{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.node.lock{opacity:.5;box-shadow:none}
.node.ear{margin-left:26px;width:calc(100% - 26px);background:var(--warnbg)}
.node.ear .n{background:var(--acc);color:#fff}
.node.ear.done .n{background:var(--ok)}
.node.boss{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.node.boss .in{display:contents}
.node.boss .n{background:rgba(255,255,255,.22);color:#fff}
.node.boss small{color:rgba(255,255,255,.85)}
.node.boss.open{box-shadow:0 10px 24px var(--priglow)}
.node b{display:block}
.node small{color:var(--mute);font-size:13px}

.prog{display:flex;gap:5px;margin:0 0 14px}
.prog i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.prog i.on{background:linear-gradient(90deg,var(--pri),var(--pri2))}
.opts{display:grid;gap:10px;margin-top:14px}
.opts .b{text-align:left;font-weight:600;padding:14px 16px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .b{text-align:center}
.opts.two .km{display:block;font-size:30px}
.big{font-size:20px;font-weight:800}
.verdict{border-radius:16px;padding:12px 14px;margin-top:12px;background:var(--surface2)}
.verdict.ok{background:var(--okbg)} .verdict.ok b{color:var(--ok)}
.verdict.part{background:var(--warnbg)}
.verdict.no{background:var(--badbg)}
.back2{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0;margin-bottom:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .card{margin:0;padding:14px 10px;text-align:center}
.pair .km{font-size:34px}

label.f{display:block;font-weight:700;margin:14px 0 4px;font-size:14px}
.f+input,.f+select{width:100%;border:0;border-radius:14px;padding:11px 14px;background:var(--surface2)}
.res{font-size:14px;margin-top:8px;word-break:break-all}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}

#show{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#show.on{display:flex}
#show .mid{flex:1;display:grid;place-items:center;padding:20px;text-align:center}
#show .km{font-size:clamp(40px,13vw,84px);font-weight:600}
#show .btns{padding:14px;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* 对话翻译 */
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:196px}
.empty{margin:9vh 4px 0;padding:22px;border-radius:22px;background:var(--surface);box-shadow:var(--sh2);color:var(--mute)}
.empty .big{color:var(--ink);margin-bottom:8px}
.empty p+p{margin-top:6px}
.bub{max-width:88%;border:0;padding:13px 16px;border-radius:22px;text-align:left;font:inherit;color:var(--ink)}
.bub .who{font-size:12px;font-weight:700;opacity:.7;margin-bottom:2px}
.bub.me{align-self:flex-end;background:linear-gradient(140deg,var(--pri),var(--pri2));color:#fff;border-bottom-right-radius:6px;box-shadow:0 10px 24px var(--priglow)}
.bub.st{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px;box-shadow:var(--sh)}
.bub.me .bz{font-size:15px;opacity:.9}
.bub.me .km{font-size:clamp(27px,8.4vw,40px);font-weight:600;margin:2px 0 0}
.bub.me .br{font-size:15px;font-weight:600;color:#FFE6A3;margin-bottom:8px}
.bub.me .w{border-radius:6px;padding:0 1px}
.bub.me .w.on{background:rgba(255,255,255,.28)}
.bub.me .b{background:rgba(255,255,255,.18);color:#fff;min-height:42px;padding:7px 14px;box-shadow:none}
.bub.me .b.pri{background:#fff;color:#2F4FD8}
.bub.me .gloss{min-height:0;margin-top:8px}
.bub .bnote{font-size:13px;opacity:.85;margin-top:6px}
.bub .lk{border:0;background:none;color:#fff;font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px 12px 2px 0}
.bub.me.cmp{display:flex;flex-direction:column;opacity:.72;padding:9px 16px;box-shadow:none;cursor:pointer}
.bub.me.cmp .km{font-size:20px;font-weight:500}
.bub.me.cmp .bz{font-size:13px}
.bub.st .who{color:var(--acc2);opacity:1}
.bub.st .km{font-size:17px;color:var(--mute)}
.bub.st .bz{font-size:24px;font-weight:700;line-height:1.35}
.bub .unsure{margin-top:8px;padding:6px 10px;border-radius:10px;background:var(--warnbg);font-size:13px}
.bub.pend{opacity:.7;font-size:15px;box-shadow:none}
.bub.pend.st{align-self:flex-start;background:var(--surface)} .bub.pend.me{align-self:flex-end}
.bub.err{background:var(--badbg);color:var(--ink);box-shadow:none}
.bub.err b{color:var(--bad)}
.bub.err.st{align-self:flex-start} .bub.err.me{align-self:flex-end}
.bub.err small{display:block;color:var(--mute);word-break:break-all;margin-top:4px}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:4;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -8px 28px rgba(15,23,42,.10);padding:12px 16px 10px}
.dock .in{max-width:528px;margin:0 auto}
.dock .typed{margin:0 0 10px}
.dock .tools{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.pill{border:0;background:var(--surface2);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--mute);min-height:34px}
.talk2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.talker{display:flex;flex-direction:column;align-items:center;text-align:center}
.hold{width:82px;height:82px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;margin-bottom:6px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .1s,box-shadow .1s}
.hold svg{width:34px;height:34px}
.hold.zhb{background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 10px 22px var(--priglow)}
.hold.kmb{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 22px var(--accglow)}
.hold.rec{background:var(--bad);transform:scale(1.12);box-shadow:0 0 0 calc(8px + var(--lv,0)*24px) var(--badglow)}
.talker .l1{font-weight:800;font-size:16px;line-height:1.4}
.talker .l1.km{line-height:1.5}
.talker .l2{font-size:12px;color:var(--mute);line-height:1.5}
#sheet{position:fixed;inset:0;z-index:15;background:rgba(8,12,24,.5);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .panel{background:var(--bg);width:100%;max-height:78vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;margin:0 auto 12px;max-width:528px}
#sheet .list{max-width:528px;margin:0 auto}
@media (prefers-reduced-motion:reduce){.hold,.mic{transition:none}}
</style>
</head>
<body>
<header id="top"><div class="bar"><h1>说高棉语</h1><span class="km" lang="km">និយាយខ្មែរ</span></div></header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="tr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h9a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-3 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M18 10h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1v3l-3-3h-3"/></svg><span>翻译</span></button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>设置</span></button>
</nav>
<div id="show"><div class="mid"><p class="km" lang="km" id="showKm"></p></div>
  <div class="btns"><button class="b pri" id="showPlay">再放一遍</button><button class="b" id="showSlow">慢速</button><button class="b ghost" id="showClose">关闭</button></div></div>
<div id="sheet"><div class="panel"><div class="hd"><b class="big">常用句</b><button class="b" id="sheetClose">关闭</button></div><ul class="list" id="phr"></ul></div></div>
<script src="app.js"></script>
</body>
</html>
